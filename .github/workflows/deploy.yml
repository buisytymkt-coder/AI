name: Deploy GoClaw to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            echo "=== Starting GoClaw Deployment ==="

            cd /opt/goclaw

            PREV_COMMIT="$(git rev-parse HEAD)"
            TARGET_BRANCH="main"

            health_check() {
              for i in $(seq 1 36); do
                if curl -sf http://localhost:18790/health > /dev/null 2>&1; then
                  echo "✅ GoClaw is healthy!"
                  return 0
                fi
                echo "  Attempt $i/36 - waiting..."
                sleep 5
              done
              return 1
            }

            rollback() {
              echo "❌ Deploy failed. Rolling back to ${PREV_COMMIT}..."
              git reset --hard "${PREV_COMMIT}"
              make up
              if health_check; then
                echo "✅ Rollback completed and healthy."
              else
                echo "❌ Rollback failed to become healthy."
                exit 1
              fi
            }

            trap rollback ERR

            # Pull latest code safely
            git fetch origin "${TARGET_BRANCH}"
            git checkout "${TARGET_BRANCH}"
            git pull --ff-only origin "${TARGET_BRANCH}"

            # 1 vCPU VPS safety: lower compose CPU limit before make up
            sed -i "s/cpus: '2.0'/cpus: '0.90'/g" docker-compose.yml docker-compose.browser.yml || true

            # Restart services
            make up

            # Wait for health check
            echo "Waiting for GoClaw to be healthy..."
            health_check

            trap - ERR

            # Final status
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== Deployment Complete ==="
